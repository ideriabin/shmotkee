<!doctype html>
<html lang="ru" style="background: oklch(0.555 0.180 18); color-scheme: light dark;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- theme-color matches the splash so iOS/Android show burgundy
         during the PWA launch chrome (before the splash markup paints). -->
    <meta name="theme-color" content="#9d1c2d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Shmotkee" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <!-- iOS PWA launch screen. SVG is best-effort; iOS officially
         wants PNGs at exact device dimensions but accepts SVG on
         recent versions. Even if iOS ignores it, the inline burgundy
         on <html> + the inline splash markup handle the in-page
         white flash. -->
    <link rel="apple-touch-startup-image" href="/splash.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600;700&family=Yeseva+One&display=swap"
      rel="stylesheet"
    />

    <title>Shmotkee</title>

    <!-- Splash: inline so it paints before the JS bundle loads.
         Removed by src/main.ts once the app mounts.

         Body bg is also burgundy inline so safe-area regions (the
         status bar strip and the home-indicator strip) are filled —
         iOS sometimes paints those from `body` rather than `html`,
         even with viewport-fit=cover. Belt + suspenders. -->
    <style>
      html, body {
        background: oklch(0.555 0.180 18); /* --accent (burgundy) */
      }
      body {
        margin: 0;
        min-height: 100dvh;
      }
      #splash {
        position: fixed;
        inset: 0;
        width: 100dvw;
        height: 100dvh;
        min-height: 100vh;
        background: oklch(0.555 0.180 18);
        color: oklch(0.985 0.003 18);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transform-origin: center;
        transition:
          opacity 380ms cubic-bezier(0.22, 1, 0.36, 1),
          transform 380ms cubic-bezier(0.22, 1, 0.36, 1);
        font-family: 'Yeseva One', 'Times New Roman', serif;
      }
      #splash .wordmark {
        font-size: 3.75rem;
        line-height: 1;
        letter-spacing: -0.02em;
        transform-origin: center;
        transition: transform 360ms cubic-bezier(0.16, 1, 0.3, 1);
      }
      #splash .bar {
        position: absolute;
        /* Sit above the home indicator so the progress sweep is fully visible. */
        bottom: max(8px, env(safe-area-inset-bottom, 0));
        left: 0;
        height: 2px;
        width: 0;
        background: oklch(0.985 0.003 18 / 0.7);
        animation: splash-bar 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      @keyframes splash-bar {
        from { width: 0; }
        to   { width: 100%; }
      }
      /* iOS-style "growing toward you" exit: wordmark scales up slightly,
         splash fades. Reads as the splash receding behind/through the
         user's view as the app takes over. */
      #splash.fade {
        opacity: 0;
        transform: scale(1.04);
        pointer-events: none;
      }
      #splash.fade .wordmark {
        transform: scale(1.08);
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <span class="wordmark">Shmotkee</span>
      <div class="bar"></div>
    </div>
    <!-- Inline timestamp so main.ts can compute elapsed splash time
         and enforce a minimum display duration. -->
    <script>document.getElementById('splash').dataset.startedAt = String(Date.now());</script>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
