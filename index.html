<!doctype html>
<html lang="ru" style="background: oklch(0.555 0.180 18); color-scheme: light dark;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- theme-color matches the splash so iOS/Android show burgundy
         during the PWA launch chrome (before the splash markup paints). -->
    <meta name="theme-color" content="#9d1c2d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Shmotkee" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <!-- iOS PWA launch screen. SVG is best-effort; iOS officially
         wants PNGs at exact device dimensions but accepts SVG on
         recent versions. Even if iOS ignores it, the inline burgundy
         on <html> + the inline splash markup handle the in-page
         white flash. -->
    <link rel="apple-touch-startup-image" href="/splash.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600;700&family=Yeseva+One&display=swap"
      rel="stylesheet"
    />

    <title>Shmotkee</title>

    <!-- Splash: inline so it paints before the JS bundle loads.
         Removed by src/main.ts once the app mounts. Burgundy bar +
         Yeseva wordmark; falls back to system serif while the font
         downloads (the brand reads from the word + colour, the exact
         glyph shape is fine to be slightly different for 200ms). -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        background: oklch(0.555 0.180 18); /* --accent (burgundy) */
        color: oklch(0.985 0.003 18);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 280ms cubic-bezier(0.22, 1, 0.36, 1);
        font-family: 'Yeseva One', 'Times New Roman', serif;
      }
      #splash .wordmark {
        font-size: 3.75rem;
        line-height: 1;
        letter-spacing: -0.02em;
      }
      #splash .bar {
        position: absolute;
        bottom: 0;
        left: 0;
        height: 2px;
        width: 0;
        background: oklch(0.985 0.003 18 / 0.7);
        animation: splash-bar 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      @keyframes splash-bar {
        from { width: 0; }
        to   { width: 100%; }
      }
      #splash.fade {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <span class="wordmark">Shmotkee</span>
      <div class="bar"></div>
    </div>
    <!-- Inline timestamp so main.ts can compute elapsed splash time
         and enforce a minimum display duration. -->
    <script>document.getElementById('splash').dataset.startedAt = String(Date.now());</script>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
